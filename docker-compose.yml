services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - QDRANT_HOST=qdrant
      # host.docker.internal resolves to the Mac host where Ollama runs natively
      - OLLAMA_URL=http://host.docker.internal:11434/api/chat
    depends_on:
      qdrant:
        condition: service_healthy
